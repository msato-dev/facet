function outlineTreeHTML(){const w=ws(),nums=numberedSections(w);const isCol=k=>state.collapsed.has(k);const noteRows=p=>p.notes.map((id,i)=>{const n=w.notes.find(n=>n.id===id);return `<div class="outline-node outline-note" draggable="true" data-kind="note" data-id="${esc(id)}" data-parent="${esc(p.id)}" title="メモをドラッグ"><span class="drag-handle">⠿</span><span class="outline-icon">▤</span><span class="outline-label">${esc(n?.title||'Missing note')}</span><span class="outline-meta">${i+1}</span></div>`}).join('');const paragraphRows=sec=>w.paragraphs.filter(p=>p.section===sec).map(p=>{let col=isCol('para:'+p.id);return `<div class="outline-paragraph-block"><div class="outline-node outline-paragraph" draggable="true" data-kind="paragraph" data-id="${esc(p.id)}" title="Paragraphをドラッグ"><button class="collapse-toggle" data-toggle="para:${esc(p.id)}">${col?'▸':'▾'}</button><span class="drag-handle">⠿</span><span class="outline-icon">¶</span><span class="outline-label">${esc(p.title)}</span><span class="outline-meta">${p.notes.length} notes</span></div>${col?'':`<div class="outline-note-list">${noteRows(p)}</div>`}</div>`}).join('');let html='';for(const sec of w.sections){const count=w.paragraphs.filter(p=>p.section===sec.id||sec.subs.some(sub=>sub.id===p.section)).length;let secCol=isCol('sec:'+sec.id);html+=`<div class="outline-section-block"><div class="outline-node outline-section" draggable="true" data-kind="section" data-id="${esc(sec.id)}"><button class="collapse-toggle" data-toggle="sec:${esc(sec.id)}">${secCol?'▸':'▾'}</button><span class="drag-handle">⠿</span><strong class="outline-label">${esc(nums[sec.id])}</strong><span class="outline-meta">${count} paragraphs</span></div>`;if(!secCol){html+=`<div class="outline-section-content">${paragraphRows(sec.id)}`;for(const sub of sec.subs){let subCol=isCol('sub:'+sub.id);html+=`<div class="outline-subsection-block"><div class="outline-node outline-subsection" draggable="true" data-kind="subsection" data-id="${esc(sub.id)}" data-parent="${esc(sec.id)}"><button class="collapse-toggle" data-toggle="sub:${esc(sub.id)}">${subCol?'▸':'▾'}</button><span class="drag-handle">⠿</span><strong class="outline-label">${esc(nums[sub.id])}</strong></div>${subCol?'':`<div class="outline-section-content">${paragraphRows(sub.id)}</div>`}</div>`}html+='</div>'}html+='</div>'}const unassigned=w.notes.filter(n=>!pFor(n.id)&&!n.archived);html+=`<div class="outline-unassigned"><div class="outline-unassigned-title">Unassigned <span class="outline-meta">${unassigned.length} notes · Outline未配置</span></div>${unassigned.map(n=>`<div class="outline-node outline-note" draggable="true" data-kind="note" data-id="${n.id}" data-parent="unassigned"><span class="drag-handle">⠿</span><span class="outline-icon">▤</span><span class="outline-label">${esc(n.title)}</span></div>`).join('')}</div>`;return html}
function moveRelative(array,source,target,after){const si=array.findIndex(x=>x===source||x.id===source),ti=array.findIndex(x=>x===target||x.id===target);if(si<0||ti<0||si===ti)return false;const [item]=array.splice(si,1);let dst=array.findIndex(x=>x===target||x.id===target);array.splice(dst+(after?1:0),0,item);return true}
function applyOutlineMove(from,to,after){const w=ws(),{kind:sk,id:sid}=from,{kind:tk,id:tid}=to;if(sk===tk&&sid===tid)return false;
 if(sk==='section'&&tk==='section')return moveRelative(w.sections,sid,tid,after);
 if(sk==='subsection'&&(tk==='subsection'||tk==='section')){const owner=w.sections.find(s=>s.subs.some(x=>x.id===sid)),sub=owner?.subs.find(x=>x.id===sid);if(!sub)return false;const dest=tk==='section'?w.sections.find(s=>s.id===tid):w.sections.find(s=>s.subs.some(x=>x.id===tid));if(!dest)return false;owner.subs.splice(owner.subs.indexOf(sub),1);const idx=tk==='section'?dest.subs.length:dest.subs.findIndex(x=>x.id===tid)+(after?1:0);dest.subs.splice(idx,0,sub);return true}
 if(sk==='paragraph'&&(tk==='paragraph'||tk==='section'||tk==='subsection')){const p=w.paragraphs.find(x=>x.id===sid);if(!p)return false;const dest=tk==='paragraph'?w.paragraphs.find(x=>x.id===tid):null;if(tk==='paragraph'&&!dest)return false;const nextSection=dest?dest.section:tid;p.section=nextSection;w.paragraphs.splice(w.paragraphs.indexOf(p),1);if(dest){const idx=w.paragraphs.indexOf(dest)+(after?1:0);w.paragraphs.splice(idx,0,p)}else{let ix=w.paragraphs.findLastIndex(x=>x.section===nextSection);w.paragraphs.splice(ix+1,0,p)}return true}
 if(sk==='note'&&(tk==='note'||tk==='paragraph')){const src=w.paragraphs.find(p=>p.notes.includes(sid));let dest=tk==='paragraph'?w.paragraphs.find(p=>p.id===tid):w.paragraphs.find(p=>p.notes.includes(tid));if(!dest)return false;if(src)src.notes.splice(src.notes.indexOf(sid),1);if(tk==='paragraph')dest.notes.push(sid);else{const idx=dest.notes.indexOf(tid);dest.notes.splice(idx+(after?1:0),0,sid)}state.selection=sid;return true}
 return false}
function bindOutlineDnD(root,refresh){if(!root)return;let from=null;root.querySelectorAll('.outline-node[draggable]').forEach(el=>{
 el.addEventListener('dragstart',e=>{from={kind:el.dataset.kind,id:el.dataset.id};state.dragId=el.dataset.id;e.dataTransfer.setData('text/plain',el.dataset.id);e.dataTransfer.effectAllowed='move';el.classList.add('outline-dragging')});
 el.addEventListener('dragend',()=>{el.classList.remove('outline-dragging');root.querySelectorAll('.drop-before,.drop-after,.drop-inside').forEach(x=>x.classList.remove('drop-before','drop-after','drop-inside'))});
 el.addEventListener('dragover',e=>{if(!from||from.id===el.dataset.id)return;e.preventDefault();e.stopPropagation();const r=el.getBoundingClientRect(),v=(e.clientY-r.top)/r.height;el.classList.remove('drop-before','drop-after','drop-inside');el.classList.add((el.dataset.kind==='section'||el.dataset.kind==='subsection'||el.dataset.kind==='paragraph')&&v>.25&&v<.75?'drop-inside':v<.5?'drop-before':'drop-after')});
 el.addEventListener('dragleave',e=>{if(!el.contains(e.relatedTarget))el.classList.remove('drop-before','drop-after','drop-inside')});
 el.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();if(!from)return;const r=el.getBoundingClientRect(),rel=(e.clientY-r.top)/r.height;const isContainer=['section','subsection','paragraph'].includes(el.dataset.kind);const isInside=isContainer&&rel>.25&&rel<.75;const after=isInside||rel>=.5;const to={kind:el.dataset.kind,id:el.dataset.id};const changed=applyOutlineMove(from,to,after);from=null;root.querySelectorAll('.drop-before,.drop-after,.drop-inside').forEach(x=>x.classList.remove('drop-before','drop-after','drop-inside'));if(changed){refresh();renderInspector();toast('Outlineの構造を更新しました')}else toast('この位置には移動できません')});
 el.addEventListener('click',()=>{if(el.dataset.kind==='note'){state.selection=el.dataset.id;renderInspector()}else if(el.dataset.kind==='paragraph'){state.selectedParagraph=el.dataset.id;state.selection=para(el.dataset.id)?.notes[0]||state.selection;renderInspector()}})
 })}
function drawOutline(){const target=$('#outlinebody');if(!target)return;target.innerHTML=outlineTreeHTML();document.querySelectorAll('.collapse-toggle').forEach(b=>b.onclick=e=>{e.stopPropagation();let k=b.dataset.toggle;state.collapsed.has(k)?state.collapsed.delete(k):state.collapsed.add(k);drawOutline()});bindOutlineDnD(target,()=>{drawOutline();refreshManuscript()});target.querySelectorAll('.outline-note').forEach(el=>el.ondblclick=e=>{e.stopPropagation();state.selection=el.dataset.id;state.inspectorTab='Note';renderInspector();openInlineNote(el)})}
function openInlineNote(el){let id=el.dataset.id,n=note(id);if(!n)return;document.querySelector('.inline-note-editor')?.remove();let panel=document.createElement('div');panel.className='inline-note-editor';panel.innerHTML=`<div class="helper">Edit note directly in Outline · Markdown</div><input class="simple-input inline-title" value="${esc(n.title)}" aria-label="Note title"><textarea class="inline-body" aria-label="Note body">${esc(n.body)}</textarea><div class="inline-actions"><button class="primary inline-save">Save note</button><button class="light-btn inline-cancel">Cancel</button></div>`;el.insertAdjacentElement('afterend',panel);el.scrollIntoView({block:'nearest'});panel.querySelector('.inline-cancel').onclick=()=>panel.remove();panel.querySelector('.inline-save').onclick=()=>{let title=panel.querySelector('.inline-title').value.trim(),body=panel.querySelector('.inline-body').value;if(!title)return toast('タイトルは必須です');if(ws().notes.some(x=>x.id!==id&&x.title.toLowerCase()===title.toLowerCase()))return toast('同一タイトルがあります');if(title!==n.title){let old=n.title;ws().notes.forEach(x=>x.body=x.body.split('[['+old+']]').join('[['+title+']]'))}n.title=title;n.body=body;drawOutline();renderInspector();refreshManuscript();toast('Outlineでメモを更新しました')}}
function cards(c){let w=ws();c.innerHTML=`<div class="listview"><h1 class="heading">Cards</h1><p class="subheading">メモ一覧 · タグ・章節所属・作成順で整理</p><div class="searchline"><input class="simple-input" id="q" placeholder="Search notes, tags, links…" value="${esc(state.search)}"><select class="simple-select" id="groupby"><option value="tag">Group: Tags</option><option value="outline">Group: Outline</option><option value="none">Group: None</option></select><select class="simple-select" id="section-filter"><option value="all">Outline: すべて</option><option value="unassigned">Unassigned</option>${w.sections.map(s=>`<option value="${s.id}">${esc(numberedSections(w)[s.id])}</option>${s.subs.map(sub=>`<option value="${sub.id}">　${esc(numberedSections(w)[sub.id])}</option>`).join('')}`).join('')}</select><select class="simple-select" id="sortby"><option value="created">Oldest first</option><option value="newest">Newest first</option><option value="title">Title</option></select></div><div id="cardsbody"></div></div>`;$('#groupby').value=state.groupBy;$('#sortby').value=state.sort;$('#section-filter').value=state.cardSection;$('#q').oninput=e=>{state.search=e.target.value;drawCards()};$('#groupby').onchange=e=>{state.groupBy=e.target.value;drawCards()};$('#sortby').onchange=e=>{state.sort=e.target.value;drawCards()};$('#section-filter').onchange=e=>{state.cardSection=e.target.value;drawCards()};drawCards()}
function drawCards(){let ns=ws().notes.filter(n=>{if(n.archived)return false;let p=pFor(n.id),sec=p?.section;let match=state.cardSection==='all'||(state.cardSection==='unassigned'?!p:sec===state.cardSection||ws().sections.some(s=>s.id===state.cardSection&&s.subs.some(sub=>sub.id===sec)));return match&&(n.title+' '+n.body+' '+n.tags.join(' ')).toLowerCase().includes(state.search.toLowerCase())});ns.sort((a,b)=>state.sort==='title'?a.title.localeCompare(b.title):state.sort==='newest'?b.created-a.created:a.created-b.created);let groups={};for(let n of ns){let keys=state.groupBy==='tag'?(n.tags.length?n.tags:['Untagged']):state.groupBy==='outline'?[pFor(n.id)?rootOf(pFor(n.id).section):'Unassigned']:['All Notes'];for(let k of keys)(groups[k]??=[]).push(n)}let h=Object.entries(groups).map(([k,arr])=>`<h3 class="pgroup-title">${esc(k)} <span class="muted" style="font-size:12px">${arr.length}</span></h3><div class="cardgrid">${arr.map(n=>noteCard(n)).join('')}</div>`).join('')||'<div class="empty">該当するメモはありません</div>';$('#cardsbody').innerHTML=h;document.querySelectorAll('.memocard[data-nid]').forEach(el=>el.onclick=()=>{state.selection=el.dataset.nid;renderInspector()})}
function noteCard(n,workspace){return `<div class="memocard" data-nid="${n.id}"><h4>${esc(n.title)}</h4>${workspace?`<div class="helper">${esc(workspace)}</div>`:''}<p>${esc(n.body.replace(/\[\[|\]\]/g,'').slice(0,95))}…</p>${n.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`}
function generateManuscript(w){return w.sections.map(s=>{let ps=w.paragraphs.filter(p=>p.section===s.id||s.subs.some(x=>x.id===p.section));return {section:s,paras:ps.map(p=>{let bodies=p.notes.map(id=>w.notes.find(n=>n.id===id)?.body||'').map(b=>b.split(/\n/).filter(x=>!/^\s*\[\[[^\]]+\]\]\s*$/.test(x)).join(' ').replace(/\[\[([^\]]+)\]\]/g,'$1').trim()).filter(Boolean);return {title:p.title,body:bodies.join(' '),sectionId:p.section}})}})}

function references(c){let refs=ws().references;c.innerHTML=`<div class="listview"><h1 class="heading">Reference</h1><p class="subheading">WorkspaceごとのZotero BibTeXライブラリ（モックデータ）</p><div class="viewbar"><input class="simple-input" id="refq" placeholder="文献・著者・引用キーを検索…" style="max-width:450px"><button class="primary" id="insertref">❞ Insert Citation</button><button class="light-btn" id="importbib">↑ Import BibTeX</button></div><table class="table"><thead><tr><th>Author / Year</th><th>Title</th><th>Citation key</th></tr></thead><tbody id="reftable"></tbody></table></div>`;function draw(q=''){$('#reftable').innerHTML=refs.filter(r=>Object.values(r).join(' ').toLowerCase().includes(q.toLowerCase())).map(r=>`<tr><td>${esc(r.author)} (${esc(r.year)})</td><td>${esc(r.title)}<div class="helper">${esc(r.journal)}</div></td><td><code>[@${esc(r.key)}]</code></td></tr>`).join('')}draw();$('#refq').oninput=e=>draw(e.target.value);$('#insertref').onclick=openCitation;$('#importbib').onclick=()=>toast('モック：実際のBibTeX読込は実装時に接続します')}
function globalCards(){let c=$('#content');let all=data.flatMap(w=>w.notes.map(n=>({...n,workspace:w.name,wsid:w.id})));c.innerHTML=`<div class="listview"><h1 class="heading">Global Cards</h1><p class="subheading">すべての論文ワークスペースのメモを横断表示</p><div class="searchline"><input class="simple-input" id="gq" placeholder="Search all notes…"><select class="simple-select" id="gws"><option value="all">All Workspaces</option>${data.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></div><div id="globalbody"></div></div>`;function draw(){let q=$('#gq').value.toLowerCase(),v=$('#gws').value;let ns=all.filter(n=>(v==='all'||n.wsid===v)&&(n.title+' '+n.body+' '+n.tags.join(' ')).toLowerCase().includes(q));$('#globalbody').innerHTML=`<div class="cardgrid">${ns.map(n=>noteCard(n,n.workspace).replace('data-nid=',`data-wsid="${n.wsid}" data-nid=`)).join('')}</div>`;c.querySelectorAll('.memocard').forEach(el=>el.onclick=()=>{state.ws=el.dataset.wsid;state.selection=el.dataset.nid;state.global=false;state.tab='Cards';shell();toast('ワークスペースを切り替えました')})}$('#gq').oninput=draw;$('#gws').onchange=draw;draw();if($('#exitglobal'))$('#exitglobal').onclick=()=>{state.global=false;state.tab='Cards';shell()}}
function action(kind){if(kind==='global'){state.global=true;shell();return}if(kind==='cite'){openCitation();return}if(kind==='plus'){newNote();return}if(kind==='group'){addGroup();return}if(kind==='multi'){state.multi=!state.multi;shell();toast('複数選択モード: '+(state.multi?'ON':'OFF'));return}if(kind==='copy'){let n=note(state.selection);if(n){state.clip={...n};toast('メモをコピーしました')}return}if(kind==='paste'){if(!state.clip)return toast('コピーされたメモがありません');let b=state.clip,title=b.title+' (copy)',i=2;while(ws().notes.some(n=>n.title===title))title=b.title+' (copy '+i+++')';let id='x'+Date.now();ws().notes.push({...b,title,id,created:Date.now()});state.selection=id;shell();toast('独立したメモを作成しました');return}if(kind==='archive'){let n=note(state.selection);if(!n)return;n.archived=!n.archived;toast(n.archived?'メモをアーカイブしました':'アーカイブを解除しました');shell();return}if(kind==='delete'){let n=note(state.selection);if(!n)return;if(!confirm('メモ「'+n.title+'」を削除しますか？（モック内のみ）'))return;ws().paragraphs.forEach(p=>p.notes=p.notes.filter(id=>id!==n.id));ws().notes=ws().notes.filter(x=>x.id!==n.id);state.selection=ws().notes[0]?.id;shell();toast('メモを削除しました（モック内のみ）');return}}

function openCitation(){let refs=ws().references;let back=document.createElement('div');back.className='modalback';back.innerHTML=`<div class="modal"><div style="display:flex;align-items:center;justify-content:space-between"><h2>Insert Citation</h2><button class="tool" id="closemodal">✕</button></div><input class="simple-input" id="citationsearch" placeholder="著者 / タイトル / Citation key を検索" autofocus><div class="choices" id="citationchoices"></div><div class="helper" style="margin-top:10px">クリックすると選択中のメモの本文末尾に挿入します。</div></div>`;document.body.appendChild(back);$('#closemodal').onclick=()=>back.remove();back.onclick=e=>{if(e.target===back)back.remove()};function draw(){let q=$('#citationsearch').value.toLowerCase();$('#citationchoices').innerHTML=refs.filter(r=>Object.values(r).join(' ').toLowerCase().includes(q)).map(r=>`<button class="refchoice" data-key="${esc(r.key)}"><b>${esc(r.author)} (${esc(r.year)})</b>${esc(r.title)}<br><small>@${esc(r.key)}</small></button>`).join('');back.querySelectorAll('.refchoice').forEach(b=>b.onclick=()=>{let n=note(state.selection);if(n){n.body+=(n.body?' ':'')+'[@'+b.dataset.key+']';back.remove();renderInspector();if(state.tab==='Canvas')paintWorld();toast('引用を挿入しました')}else toast('メモを選択してください')})}$('#citationsearch').oninput=draw;draw();$('#citationsearch').focus()}
function context(x,y,type){document.querySelector('.ctx')?.remove();let el=document.createElement('div');el.className='ctx';el.style.left=Math.min(x,innerWidth-220)+'px';el.style.top=Math.min(y,innerHeight-230)+'px';el.innerHTML=`<button data-c="note">＋ New Note</button><button data-c="para">▣ Paragraph Group</button><button data-c="citation">❞ Insert Citation</button><button data-c="fit">⤢ Fit View</button>`;document.body.appendChild(el);el.querySelectorAll('button').forEach(b=>b.onclick=()=>{el.remove();if(b.dataset.c==='note')newNote();if(b.dataset.c==='para')addGroup();if(b.dataset.c==='citation')openCitation();if(b.dataset.c==='fit')$('#fit-all')?.click()});setTimeout(()=>document.addEventListener('pointerdown',function outside(e){if(!el.contains(e.target)){el.remove();document.removeEventListener('pointerdown',outside)}},{capture:true}),10)}
function download(filename,txt){let url=URL.createObjectURL(new Blob([txt],{type:'text/markdown;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
shell();window.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('.ctx')?.remove();if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();if($('#bodyedit'))saveEditor()}});
})();
</script></body></html>
