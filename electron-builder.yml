appId: dev.facet.app
productName: FACET
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - target: portable
      arch:
        - x64
  artifactName: FACET-${version}-portable-x64.exe
portable:
  requestExecutionLevel: user
linux:
  target:
    - dir
